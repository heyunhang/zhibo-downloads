name: Import official installers
on:
  push:
    branches: [main]
    paths: [.github/workflows/import.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_REPO: heyunhang/zhibo-downloads
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch both official packages and verify their published build hashes
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 https://streamhelper.cn/downloads/windows -o Hudongya-Windows-x64.exe &
          win=$!
          curl -fLsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 https://streamhelper.cn/downloads/macos -o Hudongya-macOS-arm64.dmg &
          mac=$!
          wait "$win"
          wait "$mac"
          echo '42580b8c9851dccba60f84c0ed3c7b0e0f50179a17948456b5969d7724d6e9cf  Hudongya-Windows-x64.exe' | sha256sum --check
          echo 'c69aea95d468c1123a5ceed0a835b52e4dce35c498741c05c5e7e07ca929f033  Hudongya-macOS-arm64.dmg' | sha256sum --check
      - name: Publish both verified assets together
        run: |
          gh release create current Hudongya-Windows-x64.exe Hudongya-macOS-arm64.dmg --target "$GITHUB_SHA" --title "互动鸭直播工作台 0.3.29" --notes "Windows x64 · macOS Apple 芯片" --latest
